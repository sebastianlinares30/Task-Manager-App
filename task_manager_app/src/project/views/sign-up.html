<!DOCTYPE html>
<html>

<head>
    <title>Sign Up | Task Manager App</title>
    <link rel="stylesheet" href="../static/css/shared.css">
    <link rel="stylesheet" href="../static/css/sign_up.css">
</head>

<body class="sign-up-body">

    <div id="sign-up-page">
        <div id="sign-up-field-design">

            <h2>Create Account</h2>
            <p class="page-description">
                    Fill out the information below to create your account.
            </p>

            <form id="sign-up-form">
                <div class="sign-up-form">
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>

                <div class="sign-up-form">
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>

                <div class="sign-up-form">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="sign-up-form">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="show-password">
                    <input type="checkbox" id="show-password">
                    <label for="show-password">Show Password</label>    
                </div>

                <button type="submit" id="sign-up-btn">Sign Up</button>
            </form>

        </div>
    </div>

    <script src="../static/js/sign_up.js"></script>

</body>

</html>
